name: BRD TV 8 - natural AI voice auditions

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Audition voices first (recommended), or revoice all 12 original broadcasts
        type: choice
        options:
          - auditions
          - all12
        required: true
        default: auditions
      source_run_id:
        description: Original cryptid experiment GitHub run (for all12 mode only)
        type: string
        required: true
        default: '43644279946'

permissions:
  contents: read
  actions: read

jobs:
  ai-voice-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      BRD_VOICE_MODEL: gpt-realtime-2.1-mini
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install audio tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install -r TownTV_Factory/requirements.txt 'openai>=2,<4' websocket-client
      - name: Check saved OpenAI API key
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "Missing OPENAI_API_KEY secret"
            exit 1
          fi
      - name: Generate short voice auditions
        if: inputs.mode == 'auditions'
        run: python TownTV_Factory/openai_voice.py --audition
      - name: Upload voice auditions to listen to
        if: inputs.mode == 'auditions'
        uses: actions/upload-artifact@v4
        with:
          name: brd-tv8-ai-voice-auditions
          retention-days: 30
          path: TownTV_Factory/output/voice_auditions/
      - name: Retrieve original cryptid scripts (no new writing)
        if: inputs.mode == 'all12'
        uses: actions/download-artifact@v4
        with:
          name: brd-tv8-cryptid-pilot
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          path: TownTV_Factory/output
      - name: Revoice the original 12 videos with natural AI speech
        if: inputs.mode == 'all12'
        run: |
          python TownTV_Factory/revoice_cryptid.py --voice-engine realtime
          printf '%s\n' 'BRD TV 8 uses AI-generated character voices; not human recordings.' > TownTV_Factory/output/VOICE_DISCLOSURE.txt
      - name: Upload original broadcasts with new AI voices
        if: inputs.mode == 'all12'
        uses: actions/upload-artifact@v4
        with:
          name: brd-tv8-cryptid-natural-ai-voices
          retention-days: 30
          path: |
            TownTV_Factory/output/day_*.mp4
            TownTV_Factory/output/day_*_cryptid_*.txt
            TownTV_Factory/output/day_*_cryptid_*.json
            TownTV_Factory/output/cryptid_realtime_revoice_manifest.json
            TownTV_Factory/output/VOICE_DISCLOSURE.txt
