name: BRD TV 8 - Channel 02 overhead town preview

on:
  pull_request:
    paths:
      - 'TownTV_Factory/town_map.py'
      - 'TownTV_Factory/tests/test_town_map.py'
      - '.github/workflows/town-map-preview.yml'
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful cryptid source run to match the news
        type: string
        required: true
        default: '43648703309'

permissions:
  contents: read
  actions: read

jobs:
  overhead-map-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout town simulator
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free image and video tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install -r TownTV_Factory/requirements.txt
      - name: Run offline town-map continuity tests
        run: python -m unittest discover -s TownTV_Factory/tests -p test_town_map.py -v
      - name: Retrieve actual day reports from the original cryptid broadcasts
        uses: actions/download-artifact@v4
        with:
          name: brd-tv8-cryptid-pilot
          run-id: \${{ inputs.source_run_id || '43648703309' }}
          github-token: \${{ github.token }}
          path: TownTV_Factory/output/original_scripts
      - name: Render CH 02 animated neighborhood view
        shell: bash
        run: |
          set -euo pipefail
          REPORT="$(find TownTV_Factory/output/original_scripts -type f -name 'day_*_cryptid_report.json' | sort -V | tail -n 1)"
          test -n "$REPORT"
          python TownTV_Factory/town_map.py \
            --state TownTV_Factory/cryptid_trial_state.json \
            --report "$REPORT" \
            --seconds 55 --fps 8 \
            --output TownTV_Factory/output/bramhollow_channel_02.mp4 \
            --preview TownTV_Factory/output/bramhollow_channel_02_preview.png
      - name: Downloadable video and map preview
        uses: actions/upload-artifact@v4
        with:
          name: bramhollow-channel-02-overhead-preview
          retention-days: 30
          if-no-files-found: error
          path: |
            TownTV_Factory/output/bramhollow_channel_02.mp4
            TownTV_Factory/output/bramhollow_channel_02.json
            TownTV_Factory/output/bramhollow_channel_02_preview.png
