name: BRD TV 8 - new horror episodes with AI voices

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: brd-cryptid-pilot
  cancel-in-progress: false

jobs:
  render-cryptid-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: gpt-6-luna
      BRD_VOICE_MODEL: gpt-realtime-2.1-mini
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install video and OpenAI Realtime voice tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install -r TownTV_Factory/requirements.txt 'openai>=2,<4' websocket-client
      - name: Check for private API key
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "Missing OPENAI_API_KEY repository Actions secret."
            exit 1
          fi
      - name: Run normal town continuity tests
        run: python -m unittest discover -s TownTV_Factory/tests -v
      - name: Generate three new horror days with the OpenAI voices
        id: generate
        run: python TownTV_Factory/cryptid_trial.py --days 3 --voice realtime
      - name: Confirm all generated videos use OpenAI voices
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('TownTV_Factory/output/cryptid_trial_manifest.json').read_text())
          clips = [clip for day in data['reports'] for clip in day['clips']]
          assert len(data['reports']) == 3 and len(clips) == 12, (len(data['reports']), len(clips))
          assert all(c['voice_engine'] == 'realtime' for c in clips), clips
          print('Verified 12 new broadcasts use OpenAI Realtime voices')
          PY
          printf '%s\n' 'BRD TV 8 features synthetic AI-generated voices, not human recordings.' > TownTV_Factory/output/VOICE_DISCLOSURE.txt
      - name: Upload completed horror episodes even if a later day fails
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: brd-tv8-horror-openai-voices
          retention-days: 30
          path: |
            TownTV_Factory/output/day_*_cryptid_*.txt
            TownTV_Factory/output/day_*_cryptid_*.json
            TownTV_Factory/output/day_*_news.mp4
            TownTV_Factory/output/day_*_weather.mp4
            TownTV_Factory/output/day_*_swap_shop.mp4
            TownTV_Factory/output/day_*_night_line.mp4
            TownTV_Factory/output/cryptid_trial_manifest.json
            TownTV_Factory/output/VOICE_DISCLOSURE.txt
      - name: Save completed days of horror story continuity
        if: ${{ !cancelled() && (steps.generate.outcome == 'success' || steps.generate.outcome == 'failure') }}
        shell: bash
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add TownTV_Factory/cryptid_trial_state.json
          if ! git diff --cached --quiet; then
            git commit -m "Preserve BRD TV 8 ongoing horror history [skip ci]"
            git pull --rebase
            git push
          fi
