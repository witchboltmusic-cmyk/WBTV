name: BRD TV 8 - cryptid naming trial

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: brd-cryptid-pilot
  cancel-in-progress: false

jobs:
  render-cryptid-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: gpt-6-luna
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install video and speech tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak
          python -m pip install -r TownTV_Factory/requirements.txt 'openai>=2,<4'
      - name: Check for private API key
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "Missing OPENAI_API_KEY repository Actions secret."
            exit 1
          fi
      - name: Run normal town continuity tests
        run: python -m unittest discover -s TownTV_Factory/tests -v
      - name: Generate unscripted three-day cryptid pilot
        run: python TownTV_Factory/cryptid_trial.py --days 3 --voice espeak
      - name: Upload episodes and scripts for preview
        uses: actions/upload-artifact@v4
        with:
          name: brd-tv8-cryptid-pilot
          retention-days: 30
          path: |
            TownTV_Factory/output/day_*_cryptid_*.txt
            TownTV_Factory/output/day_*_cryptid_*.json
            TownTV_Factory/output/day_*_news.mp4
            TownTV_Factory/output/day_*_weather.mp4
            TownTV_Factory/output/day_*_swap_shop.mp4
            TownTV_Factory/output/day_*_night_line.mp4
            TownTV_Factory/output/cryptid_trial_manifest.json
      - name: Preserve pilot-only memories
        shell: bash
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add TownTV_Factory/cryptid_trial_state.json
          if ! git diff --cached --quiet; then
            git commit -m "Keep BRD TV 8 cryptid pilot history [skip ci]"
            git pull --rebase
            git push
          fi
